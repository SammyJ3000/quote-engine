[project]
name = "quote-engine"
version = "0.1.0"
description = "Deterministic bathroom refit quote engine for small UK building firms"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "simpleeval>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
